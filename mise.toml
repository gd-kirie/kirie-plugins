[settings]
lockfile = true
legacy_version_file = false

[plugins]
godot = "https://github.com/LemonNekoGH/vfox-godot.git#dd88823451008524efde019c61e222b8dbbf8f62"

[tools]
godot = "4.7.2-stable_mono"
node = "24.22.1"
pnpm = "12.15.0"
dotnet = "10.0.403"
rust = { version = "1.99.1", components = ["clippy", "rustfmt"] }
clang = { version = "23.1.4", os = ["linux"] }
"pipx:apm-cli" = "0.35.0"

[env]
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "clang"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "clang"

[tasks."build:packages"]
run = "pnpm run build:packages"

[tasks."build:dotnet"]
run = "dotnet build KiriePlugins.slnx --configuration Release"

[tasks."build:tray-native"]
run = "node scripts/build-tray-native.ts"

[tasks.lint]
depends = ["lint:eslint", "lint:rust", "lint:csharp"]

[tasks."lint:eslint"]
run = "pnpm run lint:eslint"

[tasks."lint:rust"]
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."lint:csharp"]
run = "dotnet format analyzers KiriePlugins.slnx --verify-no-changes"

[tasks.format]
depends = ["format:eslint", "format:rust", "format:csharp"]

[tasks."format:eslint"]
run = "pnpm run format:eslint"

[tasks."format:rust"]
run = "cargo fmt --all"

[tasks."format:csharp"]
run = "dotnet format style KiriePlugins.slnx"

[tasks.typecheck]
run = "pnpm run typecheck"

[tasks."test:unit"]
run = "pnpm run test:unit"

[tasks."test:tray-native"]
run = "cargo test --package kirie-tray-native --locked"

[tasks."pack:nuget"]
run = "dotnet pack KiriePlugins.slnx --configuration Release --output artifacts/nuget"

[tasks.release]
run = "pnpm run release"
