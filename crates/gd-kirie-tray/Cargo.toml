[package]
name = "kirie-tray-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "=0.5.5", features = ["api-4-7"] }
serde = "=1.0.229"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni", "muda-serde"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "=0.26.1", features = ["muda-serde"] }
